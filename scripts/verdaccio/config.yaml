# Verdaccio config for local @dreki-gg extension publishing (Windows).
# Storage + htpasswd live next to this file unless overridden on the CLI.
storage: ./storage
plugins: ./plugins

web:
  title: dreki pi-extensions (local)

# Anonymous publish is allowed for the @dreki-gg scope so no login is needed
# locally. Everything else is proxied read-only from public npm.
uplinks:
  npmjs:
    url: https://registry.npmjs.org/
    maxage: 30m

packages:
  '@dreki-gg/*':
    access: $all
    publish: $all
    unpublish: $all
  '@*/*':
    access: $all
    publish: $authenticated
    proxy: npmjs
  '**':
    access: $all
    publish: $authenticated
    proxy: npmjs

# Listen on IPv4 loopback. Clients must use http://127.0.0.1:4873 (not localhost,
# which may resolve to IPv6 ::1 on Windows).
listen: 127.0.0.1:4873

log: { type: stdout, format: pretty, level: warn }
